services:
  recipebox:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - recipebox-data:/data
    environment:
      - RECIPEBOX_DATABASE_PATH=/data/recipebox.db
      - RECIPEBOX_STORAGE_UPLOADS_DIR=/data/uploads

  docs:
    image: python:3.12-alpine
    volumes:
      - ./docs:/src/docs:ro
      - ./zensical.toml:/src/zensical.toml:ro
    ports:
      - "8000:8000"
    command: >
      sh -c "pip install --quiet zensical &&
             mkdir -p /work/docs &&
             cp /src/zensical.toml /work/ &&
             cp /src/docs/*.md /work/docs/ &&
             cd /work &&
             zensical serve --dev-addr 0.0.0.0:8000"

volumes:
  recipebox-data:
